; Experimental low-CPU profile. See docs/hosting.md before use.
; Run from runtime/ via SIMH_CONFIG and tools/boot.py; not selected by default.
; Keep game timing unchanged; accelerate only the simulated terminal lines.
; Startup and pause/resume checks have stalled on macOS; investigate on Linux.
set tim y2k
set cpu idle
set dz 8b
attach -e rp0 disks/tops10-704.dsk
attach -am dz 127.0.0.1:2020,SPEED=*8
set tu0 locked
attach -e tu0 media/t10boot.tap
boot tu0
