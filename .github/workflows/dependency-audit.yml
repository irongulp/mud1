name: Dependency audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - requirements.lock
      - .github/workflows/dependency-audit.yml
  push:
    branches: [main, setup-almalinux9]
    paths:
      - 'requirements*.txt'
      - requirements.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-deploy.txt
            requirements.lock
            requirements-storage.txt
      - name: Audit dependencies against OSV
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/python -m pip install pip-audit==2.10.1
          .audit-venv/bin/python -m pip_audit -s osv -r requirements-dev.txt -r requirements-deploy.txt
