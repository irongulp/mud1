name: Manual AlmaLinux deployment acceptance
on:
  workflow_dispatch:
    inputs:
      monitor_comparison:
        type: boolean
        default: false
        description: One baseline/candidate monitor-scope lifecycle comparison
      scoped_acceptance:
        type: boolean
        default: false
        description: Full installation and cutover acceptance with monitor correction enabled
      lifecycle_only:
        type: boolean
        default: false
        description: Scoped native install and up to three distinct backup/re-entry cycles only
permissions:
  contents: write # Needed to download the draft runtime asset before publication.
jobs:
  alma9:
    if: ${{ !inputs.monitor_comparison }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MUD86_TEST_MONITOR_SCOPE: ${{ (inputs.scoped_acceptance || inputs.lifecycle_only) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Host test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.2.1
          .venv/bin/pip install -r requirements-dev.txt
          git clone --no-checkout https://github.com/PDP-10/MUD1.git upstream/mud1
          git -C upstream/mud1 checkout --detach 8d2ce6ee5ca1ae3d835538de20aeb87acaae3df1
          PLAYWRIGHT_BROWSERS_PATH="$PWD/runtime/browsers" .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python -m unittest discover -s tests -v
      - name: Fetch pinned candidate runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/release-v1
          gh release download runtime-v1 --pattern mud86-runtime.tar.gz --dir runtime/release-v1
      - name: Start native x86 AlmaLinux with systemd
        run: |
          docker build -t mud86-alma9 -f deploy/Dockerfile.alma9 .
          docker run -d --name mud86-install-test --privileged --cgroupns=host \
            --cpus=1 --memory=2g --tmpfs /run --tmpfs /tmp \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/checkout:ro" -v "$PWD/runtime/release-v1:/artifacts:ro" \
            -p 127.0.0.1:38080:80 -p 127.0.0.1:38443:443 mud86-alma9
          for attempt in $(seq 1 30); do
            docker exec mud86-install-test systemctl is-system-running && break
            sleep 1
          done
      - name: Install, rerun, saved login, timing, backup and restart
        run: .venv/bin/python -m tests.integration_deployment ${{ inputs.lifecycle_only && '--backup-cycles 3' || '' }}
      - name: Chromium multiplayer through Nginx
        if: ${{ !inputs.lifecycle_only }}
        run: |
          .venv/bin/python -c "import asyncio; from tests.browser_smoke import main; asyncio.run(main('http://mud.etimbo.com:38080', launch_args=['--host-resolver-rules=MAP mud.etimbo.com 127.0.0.1']))"
      - name: HTTPS and secure WebSockets with a test certificate
        if: ${{ !inputs.lifecycle_only }}
        run: |
          docker exec -w /checkout mud86-install-test /opt/mud86/current/.venv/bin/python -m tests.deployment_tls_fixture
          .venv/bin/python -c "import asyncio; from tests.browser_smoke import main; asyncio.run(main('https://mud.etimbo.com:38443', launch_args=['--host-resolver-rules=MAP mud.etimbo.com 127.0.0.1'], ignore_https_errors=True))"
      - name: Reboot container and recheck browser
        if: ${{ !inputs.lifecycle_only }}
        run: |
          docker exec mud86-install-test systemctl stop mud86-runtime.service
          docker restart --timeout 180 mud86-install-test
          for attempt in $(seq 1 60); do
            docker exec mud86-install-test systemctl show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mud86-install-test systemctl start mud86-runtime.service mud86-gateway.service nginx
          .venv/bin/python -c "import asyncio; from tests.browser_smoke import main; asyncio.run(main('https://mud.etimbo.com:38443', launch_args=['--host-resolver-rules=MAP mud.etimbo.com 127.0.0.1'], ignore_https_errors=True))"
          docker stats --no-stream mud86-install-test
      # Both a populated native cutover and an empty external installation
      # use the real installer on native x86, never a Mac lab disk.
      - name: Native-to-MariaDB cutover and external rerun/backup
        if: ${{ !inputs.lifecycle_only }}
        run: .venv/bin/python -m tests.integration_external_deployment --native-url https://127.0.0.1:38443
      - name: Start fresh external installation container
        if: ${{ !inputs.lifecycle_only }}
        run: |
          docker run -d --name mud86-external-fresh --privileged --cgroupns=host \
            --cpus=1 --memory=2g --tmpfs /run --tmpfs /tmp \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/checkout:ro" -v "$PWD/runtime/release-v1:/artifacts:ro" \
            -p 127.0.0.1:48080:80 mud86-alma9
          for attempt in $(seq 1 60); do
            docker exec mud86-external-fresh systemctl show-environment >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Fresh external installation and persistence
        if: ${{ !inputs.lifecycle_only }}
        run: .venv/bin/python -m tests.integration_external_deployment --fresh --container mud86-external-fresh --url http://127.0.0.1:48080
      - name: Database editor permissions, concurrency and recovery
        if: ${{ !inputs.lifecycle_only }}
        run: |
          docker exec -w /checkout mud86-install-test runuser -u mud86 -- /opt/mud86/current/.venv/bin/python -m tests.integration_database_access --output /var/lib/mud86/editor-acceptance
          mkdir -p runtime/database-editor-ci
          docker cp mud86-install-test:/var/lib/mud86/editor-acceptance/report.json runtime/database-editor-ci/report.json
      - name: Service diagnostics
        if: always()
        run: python3 -m tests.deployment_diagnostics
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-results
          path: |
            runtime/deployment-*/**/*.log
            runtime/deployment-*/**/report.json
            runtime/browser.png
            runtime/external-deployment-*/**/*.log
            runtime/external-deployment-*/**/report.json
            runtime/database-editor-ci/report.json
  monitor-comparison:
    if: inputs.monitor_comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare pinned media and native build environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/release-v1 runtime/monitor-evidence
          gh release download runtime-v1 --pattern mud86-runtime.tar.gz --dir runtime/release-v1
          docker build -t mud86-monitor -f deploy/Dockerfile.alma9 .
          docker run --name mud86-monitor-tools mud86-monitor dnf install -y procps-ng
          docker commit mud86-monitor-tools mud86-monitor
          docker rm mud86-monitor-tools
          docker run -d --name mud86-focused --memory=2g --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/checkout:ro" -v "$PWD/runtime/monitor-evidence:/evidence" \
            -w /checkout mud86-monitor sleep infinity
          docker exec mud86-focused bash -euc '
            python3.12 -m venv /tmp/venv
            /tmp/venv/bin/pip install -r requirements-deploy.txt
            /tmp/venv/bin/pip install --require-hashes -r requirements-storage.txt
            /tmp/venv/bin/python -m unittest tests.test_runtime_scope tests.test_monitor_comparison tests.test_monitor_bootstrap tests.test_monitor_scope -v
            git clone --no-checkout https://github.com/simh/simh.git /tmp/simh
            git -C /tmp/simh checkout --detach 47b7ddabbe5b548cfc32f2fd45f7bed238ff7921
            /tmp/venv/bin/python -m tools.local_simulator --source /tmp/simh --cache /tmp/simh-cache
          '
      - name: Single bounded lifecycle arm
        run: |
          docker update --cpus=1 mud86-focused
          docker exec mud86-focused /tmp/venv/bin/python -m tests.integration_monitor_comparison \
            --output /evidence/probe --archive /checkout/runtime/release-v1/mud86-runtime.tar.gz \
            --simh /tmp/simh-cache/source/BIN/pdp10 ${{ matrix.arm == 'candidate' && '--candidate' || '' }}
      - name: Remove disposable fixture
        if: always()
        run: docker rm -f mud86-focused
      # Only sanitized summaries; never upload raw history, stack/AC words or disks.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: monitor-comparison-${{ matrix.arm }}
          path: runtime/monitor-evidence/probe/report.json
