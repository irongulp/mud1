name: AlmaLinux deployment
on:
  pull_request:
    branches: [main]
  push:
    branches: [setup-almalinux9]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: write # Needed to download the draft runtime asset before publication.
jobs:
  alma9:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/python -m pip install pip-audit==2.10.1
          .audit-venv/bin/python -m pip_audit -s osv -r requirements-dev.txt -r requirements-deploy.txt
      - name: Host test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.2.1
          .venv/bin/pip install -r requirements-dev.txt
          git clone --no-checkout https://github.com/PDP-10/MUD1.git upstream/mud1
          git -C upstream/mud1 checkout --detach 8d2ce6ee5ca1ae3d835538de20aeb87acaae3df1
          PLAYWRIGHT_BROWSERS_PATH="$PWD/runtime/browsers" .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python -m unittest discover -s tests -v
      - name: Fetch pinned candidate runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/release-v1
          gh release download runtime-v1 --pattern mud86-runtime.tar.gz --dir runtime/release-v1
      - name: Fresh native and external lifecycle, including confirmed final shutdown
        run: .venv/bin/python -m tests.deployment_lifecycle --output runtime/deployment-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-results
          path: |
            runtime/deployment-*/**/*.log
            runtime/deployment-*/**/report.json
            runtime/browser.png
            runtime/browser.admission.json
            runtime/external-deployment-*/**/*.log
            runtime/external-deployment-*/**/report.json
            runtime/database-editor-ci/report.json
            runtime/deployment-lifecycle/**/*.json
            runtime/deployment-lifecycle/*.png
