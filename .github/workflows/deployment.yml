name: Manual AlmaLinux deployment acceptance
on:
  workflow_dispatch:
    inputs:
      guarded_profile:
        type: boolean
        default: true
        description: Test recommended monitor-scope and batch-preflight deployment (installer defaults remain unchanged)
      terminal_lifecycle:
        type: boolean
        default: false
        description: Focused native terminal-reuse diagnostic only, not full release acceptance
      shutdown_reproduction:
        type: boolean
        default: false
        description: Installed native rerun/backup/restart with fixture-only shutdown capture
      shutdown_scenario:
        type: choice
        default: native
        options: [native, fresh-mariadb]
        description: Installed lifecycle exercised when shutdown_reproduction is enabled
permissions:
  contents: write # Needed to download the draft runtime asset before publication.
jobs:
  alma9:
    if: ${{ !inputs.terminal_lifecycle && !inputs.shutdown_reproduction }}
    name: AlmaLinux / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scenario: [native-upgrade, fresh-mariadb]
    env:
      MUD86_TEST_MONITOR_SCOPE: ${{ inputs.guarded_profile && '1' || '0' }}
      MUD86_TEST_BATCH_PREFLIGHT: ${{ inputs.guarded_profile && '1' || '0' }}
      ACCEPTANCE_CONTAINER: ${{ matrix.scenario == 'native-upgrade' && 'mud86-install-test' || 'mud86-external-fresh' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Host test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.2.1
          .venv/bin/pip install -r requirements-dev.txt
          git clone --no-checkout https://github.com/PDP-10/MUD1.git upstream/mud1
          git -C upstream/mud1 checkout --detach 8d2ce6ee5ca1ae3d835538de20aeb87acaae3df1
          PLAYWRIGHT_BROWSERS_PATH="$PWD/runtime/browsers" .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python -m unittest discover -s tests -v
      - name: Fetch pinned candidate runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/release-v1
          gh release download runtime-v1 --pattern mud86-runtime.tar.gz --dir runtime/release-v1
      - name: Build AlmaLinux systemd image
        run: docker build -t mud86-alma9 -f deploy/Dockerfile.alma9 .
      - name: Start native x86 AlmaLinux with systemd
        if: matrix.scenario == 'native-upgrade'
        run: |
          docker run -d --name mud86-install-test --privileged --cgroupns=host \
            --cpus=1 --memory=2g --tmpfs /run --tmpfs /tmp \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/checkout:ro" -v "$PWD/runtime/release-v1:/artifacts:ro" \
            -p 127.0.0.1:38080:80 -p 127.0.0.1:38443:443 mud86-alma9
          for _ in $(seq 1 30); do
            docker exec mud86-install-test systemctl is-system-running && break
            sleep 1
          done
      - name: Install, rerun, saved login, timing, backup and restart
        if: matrix.scenario == 'native-upgrade'
        run: .venv/bin/python -m tests.integration_deployment
      - name: Chromium multiplayer through Nginx
        if: matrix.scenario == 'native-upgrade'
        run: |
          .venv/bin/python -c "import asyncio; from tests.browser_smoke import main; asyncio.run(main('http://mud.etimbo.com:38080', launch_args=['--host-resolver-rules=MAP mud.etimbo.com 127.0.0.1']))"
      - name: HTTPS and secure WebSockets with a test certificate
        if: matrix.scenario == 'native-upgrade'
        run: |
          docker exec -w /checkout mud86-install-test /opt/mud86/current/.venv/bin/python -m tests.deployment_tls_fixture
          .venv/bin/python -c "import asyncio; from tests.browser_smoke import main; asyncio.run(main('https://mud.etimbo.com:38443', launch_args=['--host-resolver-rules=MAP mud.etimbo.com 127.0.0.1'], ignore_https_errors=True))"
      - name: Reboot container and recheck browser
        if: matrix.scenario == 'native-upgrade'
        run: |
          docker exec mud86-install-test mud86ctl stop
          docker restart --timeout 180 mud86-install-test
          for _ in $(seq 1 60); do
            docker exec mud86-install-test systemctl show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mud86-install-test systemctl start mud86-runtime.service mud86-gateway.service nginx
          .venv/bin/python -c "import asyncio; from tests.browser_smoke import main; asyncio.run(main('https://mud.etimbo.com:38443', launch_args=['--host-resolver-rules=MAP mud.etimbo.com 127.0.0.1'], ignore_https_errors=True))"
          docker stats --no-stream mud86-install-test
      # Both a populated native cutover and an empty external installation
      # use the real installer on native x86, never a Mac lab disk.
      - name: Native-to-MariaDB cutover and external rerun/backup
        if: matrix.scenario == 'native-upgrade'
        run: .venv/bin/python -m tests.integration_external_deployment --native-url https://127.0.0.1:38443
      - name: Start fresh external installation container
        if: matrix.scenario == 'fresh-mariadb'
        run: |
          docker run -d --name mud86-external-fresh --privileged --cgroupns=host \
            --cpus=1 --memory=2g --tmpfs /run --tmpfs /tmp \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/checkout:ro" -v "$PWD/runtime/release-v1:/artifacts:ro" \
            -p 127.0.0.1:48080:80 mud86-alma9
          for _ in $(seq 1 60); do
            docker exec mud86-external-fresh systemctl show-environment >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Fresh external installation and persistence
        if: matrix.scenario == 'fresh-mariadb'
        run: .venv/bin/python -m tests.integration_external_deployment --fresh --container mud86-external-fresh --url http://127.0.0.1:48080
      - name: Database editor permissions, concurrency and recovery
        run: |
          docker exec -w /checkout "$ACCEPTANCE_CONTAINER" runuser -u mud86 -- /opt/mud86/current/.venv/bin/python -m tests.integration_database_access --output /var/lib/mud86/editor-acceptance
          mkdir -p runtime/database-editor-ci
          docker cp "$ACCEPTANCE_CONTAINER:/var/lib/mud86/editor-acceptance/report.json" runtime/database-editor-ci/report.json
      - name: Service diagnostics
        if: always()
        run: python3 -m tests.deployment_diagnostics
      - name: Verify final native shutdown
        if: always()
        run: python3 -m tests.deployment_diagnostics --verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-results-${{ matrix.scenario }}
          path: |
            runtime/deployment-*/**/*.log
            runtime/deployment-*/**/report.json
            runtime/browser.png
            runtime/external-deployment-*/**/*.log
            runtime/external-deployment-*/**/report.json
            runtime/database-editor-ci/report.json
  terminal-lifecycle:
    if: inputs.terminal_lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare pinned media and browser fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/release-v1 runtime/terminal-lifecycle
          gh release download runtime-v1 --pattern mud86-runtime.tar.gz --dir runtime/release-v1
          docker build --target browser-tests -t mud86-terminal-fixture -f deploy/Dockerfile.alma9 .
          docker run --name mud86-terminal-tools mud86-terminal-fixture dnf install -y procps-ng
          docker commit mud86-terminal-tools mud86-terminal-fixture
          docker rm mud86-terminal-tools
          docker run -d --name mud86-focused --memory=2g --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/checkout:ro" -v "$PWD/runtime/terminal-lifecycle:/evidence" \
            -w /checkout mud86-terminal-fixture sleep infinity
          docker exec mud86-focused bash -euc '
            python -m unittest tests.test_terminal_shutdown_capture tests.test_gateway_lifecycle_evidence tests.test_gateway_carrier -v
            git clone --no-checkout https://github.com/simh/simh.git /tmp/simh
            git -C /tmp/simh checkout --detach 47b7ddabbe5b548cfc32f2fd45f7bed238ff7921
            python -m tools.local_simulator --source /tmp/simh --cache /tmp/simh-cache
          '
      - name: One bounded native terminal lifecycle
        run: |
          docker update --cpus=1 mud86-focused
          docker exec mud86-focused python -m tests.integration_terminal_lifecycle \
            --output /evidence/probe --archive /checkout/runtime/release-v1/mud86-runtime.tar.gz \
            --simh /tmp/simh-cache/source/BIN/pdp10
      - name: Remove fixture
        if: always()
        run: docker rm -f mud86-focused
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terminal-lifecycle
          path: |
            runtime/terminal-lifecycle/probe/*.json
            runtime/terminal-lifecycle/probe/*.log
            runtime/terminal-lifecycle/probe/failure-*.txt
            runtime/terminal-lifecycle/probe/pre-shutdown-systat.txt
            runtime/terminal-lifecycle/probe/shutdown-failure-dz.txt
  shutdown-reproduction:
    if: inputs.shutdown_reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MUD86_TEST_MONITOR_SCOPE: '1'
      MUD86_TEST_BATCH_PREFLIGHT: '1'
      ACCEPTANCE_CONTAINER: ${{ inputs.shutdown_scenario == 'fresh-mariadb' && 'mud86-external-fresh' || 'mud86-install-test' }}
      ACCEPTANCE_HTTP_PORT: ${{ inputs.shutdown_scenario == 'fresh-mariadb' && '48080' || '38080' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m unittest tests.test_terminal_shutdown_capture tests.test_gateway_lifecycle_evidence -v
          mkdir -p runtime/release-v1 runtime/shutdown-capture
          gh release download runtime-v1 --pattern mud86-runtime.tar.gz --dir runtime/release-v1
          docker build -t mud86-alma9 -f deploy/Dockerfile.alma9 .
          docker run -d --name "$ACCEPTANCE_CONTAINER" --privileged --cgroupns=host \
            --cpus=1 --memory=2g --tmpfs /run --tmpfs /tmp \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/checkout:ro" -v "$PWD/runtime/release-v1:/artifacts:ro" \
            -p "127.0.0.1:$ACCEPTANCE_HTTP_PORT:80" -p 127.0.0.1:38443:443 mud86-alma9
          for _ in $(seq 1 60); do
            docker exec "$ACCEPTANCE_CONTAINER" systemctl show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$ACCEPTANCE_CONTAINER" install -Dm644 /checkout/tests/fixtures/shutdown-capture.conf /etc/systemd/system/mud86-runtime.service.d/shutdown-capture.conf
      - name: Installed native lifecycle
        if: inputs.shutdown_scenario != 'fresh-mariadb'
        run: .venv/bin/python -m tests.integration_deployment
      - name: Installed external lifecycle
        if: inputs.shutdown_scenario == 'fresh-mariadb'
        run: .venv/bin/python -m tests.integration_external_deployment --fresh --container mud86-external-fresh --url http://127.0.0.1:48080
      - name: External database editor and recovery
        if: inputs.shutdown_scenario == 'fresh-mariadb'
        run: |
          docker exec -w /checkout "$ACCEPTANCE_CONTAINER" runuser -u mud86 -- /opt/mud86/current/.venv/bin/python -m tests.integration_database_access --output /var/lib/mud86/editor-acceptance
          mkdir -p runtime/database-editor-ci
          docker cp "$ACCEPTANCE_CONTAINER:/var/lib/mud86/editor-acceptance/report.json" runtime/database-editor-ci/report.json
      - name: Retain service and shutdown evidence
        if: always()
        run: |
          python3 -m tests.deployment_diagnostics
          docker cp "$ACCEPTANCE_CONTAINER:/var/lib/mud86/shutdown-capture/." runtime/shutdown-capture/
      - name: Verify final native shutdown
        if: always()
        run: python3 -m tests.deployment_diagnostics --verify
      - name: Remove fixture
        if: always()
        run: docker rm -f "$ACCEPTANCE_CONTAINER"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-shutdown-capture
          path: |
            runtime/deployment-*/**/*.log
            runtime/deployment-*/**/report.json
            runtime/shutdown-capture/**/*.json
            runtime/shutdown-capture/**/*.txt
            runtime/external-deployment-*/**/*.log
            runtime/external-deployment-*/**/report.json
            runtime/database-editor-ci/report.json
